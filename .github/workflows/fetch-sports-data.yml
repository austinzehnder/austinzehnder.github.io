name: Fetch sports data
on:
  push:
    branches: [main]
    paths: ['sports/**']
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 sports/scripts/fetch-data.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sports/data
          git diff --cached --quiet || git commit -m "Update sports data" && git push
