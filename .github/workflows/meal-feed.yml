name: Meal calendar feed

# Regenerates meals/feed.ics from the shared Supabase weeks table so the
# subscribable calendar stays in step with the planner (hourly refresh is
# plenty — calendar apps re-fetch subscriptions on their own schedule anyway).
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate feed.ics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node meals/scripts/build-feed.js
      - name: Commit if changed
        run: |
          git config user.name "whats-cookin-bot"
          git config user.email "whats-cookin-bot@users.noreply.github.com"
          git add meals/feed.ics
          git diff --cached --quiet || git commit -m "Refresh meal calendar feed"
          git push
